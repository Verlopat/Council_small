name: Opt-in scored model regression

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    # Disabled until repo owner explicitly opts in after checking all free quotas.
    if: vars.COUNCIL_RUN_LIVE_REGRESSION == 'true' && vars.COUNCIL_WEEKLY_MAX_REQUESTS != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run bounded known-answer regression
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_TRIAL_CONFIRMED: ${{ vars.COHERE_TRIAL_CONFIRMED }}
          OLLAMA_FREE_CONFIRMED: ${{ vars.OLLAMA_FREE_CONFIRMED }}
        run: |
          python -m eval.regression_live --confirm-free --max-requests '${{ vars.COUNCIL_WEEKLY_MAX_REQUESTS }}' --out runs/regression.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: scored-regression
          path: runs/regression.jsonl
          retention-days: 30
