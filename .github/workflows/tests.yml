name: Council and router offline tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline suite
        run: python -m unittest discover -s tests -v
      - name: Check original interactive router
        run: python -m unittest -v test_simple_router.py
      - name: CLI smoke checks without real API keys
        run: |
          python model_router.py --list
          python -m council.cli --list-families
          python -m council.cli --dry-run --mode research "Test research question"
          python -m council.cli --help
          python -m council.cli --mode full --dry-run 'Test full allocation'
          python -m eval.generate_tasks --out runs/phase_a_dev.jsonl --per-kind 30
      - name: Syntax check
        run: python -m compileall -q council tests model_router.py simple_router.py router_policy.py
