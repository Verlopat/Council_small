name: Offline Council regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax-check all active Python modules
        run: python -m compileall -q council eval tests answer_validation.py model_router.py simple_router.py
      - name: Syntax-check both experiment scripts
        run: |
          bash -n scripts/benchmark_vrf_modes.sh
          bash -n scripts/benchmark_phase_a_modes.sh
      - name: Run offline regressions
        run: python -m unittest discover -s tests -v
