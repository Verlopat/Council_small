name: Offline Council regression tests

on:
  push:
    branches: [main, fix/rfc-claim-filter-regressions]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regressions
        run: python -m unittest discover -s tests -v
