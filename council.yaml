# Corrected v4: three independent proposals, with a separate auditor.
# Four solvers require either a distinct auditor family or auditor: null.
# Never reuse a solver as its own auditor. The missing audit must be reported.
mode: full
deadline_seconds: 600
per_call_timeout: 28
solvers:
  - {family: gpt-oss, strategy: direct}
  - {family: command, strategy: code}
  - {family: nemotron, strategy: decompose}
translator: glm
judge: gemini
auditor: gemma
max_claims: 12
hunter_cap: 4
optional:
  # If Ollama Cloud denies free usage (HTTP 402), use the independent
  # LLM7 MiniMax family only when your LLM7 key has free access.
  audit_fallbacks: [minimax]
  coverage_llm: false
  relevance_check: false
  critics: []
  repair_round: true
  adaptive_seeds: false
caps:
  messages: 5
  verifier_calls: 2
  repairs: 1
  pair_exchanges: 3
# Unset rather than inventing free-tier limits. Fill from your own dashboards.
rate_limits: {}
